<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form page for submitting feedback and ratings on products.">
    <meta name="author" content="David Bellon Asencio">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <div class="form-item">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="form-item">
                <label>Overall Rating</label>
                <div class="rating-group">
                    <div class="rating-option">
                        <span>☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">1 Star</label>
                    </div>
                    <div class="rating-option">
                        <span>☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <label for="rating2">2 Stars</label>
                    </div>
                    <div class="rating-option">
                        <span>☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <label for="rating3">3 Stars</label>
                    </div>
                    <div class="rating-option">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <label for="rating4">4 Stars</label>
                    </div>
                    <div class="rating-option">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <label for="rating5">5 Stars</label>
                    </div>
                </div>
            </div>

            <div class="form-item">
                <label for="installdate">Date of Installation</label>
                <input type="date" id="installdate" name="installdate" required>
            </div>

            <div class="form-item">
                <label>Which features did you find useful in the product?<br><em>(Check all that apply)</em></label>
                <div class="checkbox-option">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    <label for="feature-durability">Durability</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" id="feature-easeofuse" name="features" value="easeofuse">
                    <label for="feature-easeofuse">Ease of Use</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    <label for="feature-performance">Performance</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    <label for="feature-design">Design</label>
                </div>
            </div>

            <div class="form-item">
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review" rows="4"></textarea>
            </div>

            <div class="form-item">
                <label for="username">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="username" name="username">
            </div>

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="year"></span> David Bellon Asencio</p>
        <p>Peru</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
